networks:
  monitoring:
  snaknet:
    external: true

services:
  
  grafana:
    image: grafana/grafana-oss:latest
    ports:
      - "4000:4000"
    networks:
      - monitoring
      - snaknet
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    ports:
      - "9115:9115"
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml
    command:
      - "--config.file=/etc/blackbox/blackbox.yml"

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring
      - snaknet
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/rules:/etc/prometheus/rules/

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    networks:
      - monitoring
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    ports:
      - "9187:9187"
    networks:
      - monitoring
      - snaknet      
    environment:
      DATA_SOURCE_NAME: >-
        postgresql://admin:admin@postgres:5432/postgres?sslmode=disable

  karma:
    image: ghcr.io/prymitive/karma:latest
    container_name: karma
    ports:
      - "8080:8080"
    networks:
      - monitoring
    environment:
      CONFIG_FILE: >-
        /etc/karma/karma.yml
    volumes:
      - ./karma/karma.yml:/etc/karma/karma.yml
    
      
  cloudwatch-exporter:
    image: quay.io/prometheus/cloudwatch-exporter
    container_name: cloudwatch-exporter
    restart: always
    ports:
      - "9106:9106"
    networks:
      - monitoring
    volumes:
      - ./cloudwatch/config.yml:/config/config.yml:ro
    command:
      "/config/config.yml"
    env_file:
      - .env


  