networks:
  edge: {}
  kcnet:
    external: true
  monitoring:
    external: true

services:
  
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: always
    command:
      - --entrypoints.websecure.address=:443
      - --providers.file.directory=/etc/traefik/dynamic
      - --api.dashboard=true
    ports:
      - "443:443"
      - "8081:8080" # dashboard
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
      - ./traefik/certs:/certs:ro
    networks: [edge, kcnet, monitoring]