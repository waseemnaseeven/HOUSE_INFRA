# --- macOS ---
- name: Ensure Homebrew present (macOS)
  when: ansible_facts.os_family == "Darwin"
  community.general.homebrew:
    state: present

- name: Install Syncthing (macOS)
  when: ansible_facts.os_family == "Darwin"
  community.general.homebrew:
    name: "{{ syncthing_package_name }}"
    state: present

- name: Start & enable Syncthing service (macOS)
  when: ansible_facts.os_family == "Darwin"
  community.general.homebrew_services:
    name: "{{ syncthing_service_name }}"
    state: started
    enabled: true

# --- Linux (Debian/RedHat) ---
- name: Install Syncthing (Linux)
  when: ansible_facts.os_family in ["Debian", "RedHat"]
  become: true
  package:
    name: "{{ syncthing_package_name }}"
    state: present
    update_cache: "{{ 'true' if ansible_facts.os_family == 'Debian' else omit }}"

- name: Ensure systemd user dir exists (Linux)
  when: ansible_facts.os_family in ["Debian", "RedHat"]
  file:
    path: "{{ ansible_env.HOME }}/.config/systemd/user"
    state: directory
    mode: "0700"

- name: Install Syncthing user service unit (Linux)
  when: ansible_facts.os_family in ["Debian", "RedHat"]
  copy:
    dest: "{{ ansible_env.HOME }}/.config/systemd/user/{{ syncthing_service_name }}.service"
    mode: "0644"
    content: "{{ syncthing_systemd_unit }}"

- name: Enable user lingering so service runs at boot (Linux)
  when: ansible_facts.os_family in ["Debian", "RedHat"]
  become: true
  command: "loginctl enable-linger {{ ansible_user_id }}"
  changed_when: false

- name: daemon-reload (user) (Linux)
  when: ansible_facts.os_family in ["Debian", "RedHat"]
  systemd:
    daemon_reload: true
    scope: user

- name: Enable & start Syncthing (user) (Linux)
  when: ansible_facts.os_family in ["Debian", "RedHat"]
  systemd:
    name: "{{ syncthing_service_name }}.service"
    scope: user
    enabled: true
    state: started

- name: Ensure Syncthing config dir exists
  file:
    path: "{{ syncthing_config_dir }}"
    state: directory
    mode: "0700"
