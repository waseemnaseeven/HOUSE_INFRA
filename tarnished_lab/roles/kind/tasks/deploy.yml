---
- name: Copy apps template
  template:
    src: "apps.yml.j2"
    dest: "/tmp/apps.yml"
    mode: 0755
  tags:
    - deploy

- name: Apply nginx
  shell: "kubectl apply -f /tmp/apps.yml"
  tags:
    - deploy

