- name: Copy apps template
  template:
    src: "ingress_apps.yml.j2"
    dest: "/tmp/ingress_apps.yml"
    mode: 0755
  tags:
    - deploy

- name: Apply nginx ingress
  shell: "kubectl apply -f /tmp/ingress_apps.yml"
  tags:
    - deploy