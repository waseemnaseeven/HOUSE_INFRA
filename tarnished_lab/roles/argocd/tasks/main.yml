---
- name: Ensure argocd namespace exists
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: argocd
    state: present

- name: Install ArgoCD manifests
  kubernetes.core.k8s:
    state: present
    src: "argocd-install.yml"


- name: Expose ArgoCD with Traefik Ingress
  kubernetes.core.k8s:
    state: present
    src: "argocd-ingress.yml"

- name: Register Git repository for ArgoCD
  kubernetes.core.k8s:
    state: present
    src: "{{ role_path }}/files/argocd-repo-secret.yaml"
