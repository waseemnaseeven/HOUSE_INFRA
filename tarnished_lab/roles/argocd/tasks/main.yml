---
# ─── 0. Check if ArgoCD is already installed ─────────────────────────────────
- name: Check if ArgoCD server deployment exists
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_kubeconfig }}"
    api_version: apps/v1
    kind: Deployment
    name: argocd-server
    namespace: "{{ argocd_namespace }}"
  register: argocd_existing
  ignore_errors: true

- name: Set ArgoCD installed fact
  ansible.builtin.set_fact:
    argocd_installed: >-
      {{ argocd_existing.resources | default([]) | length > 0 and
         (argocd_existing.resources[0].status.readyReplicas | default(0)) >= 1 }}

- name: Ensure argocd namespace exists
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_kubeconfig }}"
    api_version: v1
    kind: Namespace
    name: "{{ argocd_namespace }}"
    state: present
  when: not argocd_installed

- name: Install ArgoCD manifests from official release
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_kubeconfig }}"
    namespace: "{{ argocd_namespace }}"
    state: present
    src: "https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml"
  when: not argocd_installed

- name: Wait for ArgoCD server to be ready
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_kubeconfig }}"
    api_version: apps/v1
    kind: Deployment
    name: argocd-server
    namespace: "{{ argocd_namespace }}"
  register: argocd_server
  until: >-
    argocd_server.resources | length > 0 and
    (argocd_server.resources[0].status.readyReplicas | default(0)) >= 1
  retries: 30
  delay: 10
  when: not argocd_installed

- name: Wait for ArgoCD CRDs to be available
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_kubeconfig }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: applications.argoproj.io
  register: argocd_crd
  until: argocd_crd.resources | length > 0
  retries: 30
  delay: 10

- name: Apply ArgoCD blog application
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_kubeconfig }}"
    state: present
    definition: "{{ lookup('file', role_path + '/apps/argocd-application-blog.yml') | from_yaml }}"
    wait: true
    wait_timeout: 120
  retries: 3
  delay: 15
