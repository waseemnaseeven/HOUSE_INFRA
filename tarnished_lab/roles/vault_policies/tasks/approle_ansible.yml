---
# vault_policies/tasks/approle_ansible.yml
#
# Configures the "ansible" AppRole with the "ansible" policy.
#
# Idempotency:
#   - AppRole creation/update is always idempotent (PUT).
#   - secret_id generation is protected by the sentinel .approle_ansible_bootstrapped.
#     A secret_id cannot be read back after generation — it is therefore generated
#     only once and saved immediately.
#


- name: Check AppRole ansible bootstrap sentinel
  ansible.builtin.stat:
    path: "{{ vault_backup_dir }}/.approle_ansible_bootstrapped"
  delegate_to: localhost
  become: false
  register: _approle_ansible_sentinel_stat

- name: Debug AppRole ansible sentinel status
  ansible.builtin.debug:
    msg: "{{ 'AppRole ansible already bootstrapped (sentinel present).' if _approle_ansible_sentinel_stat.stat.exists else 'No sentinel — bootstrapping AppRole ansible.' }}"

# AppRole creation/update — always idempotent (PUT)
- name: Create or update AppRole 'ansible'
  ansible.builtin.uri:
    url: "{{ vault_policies_api_url }}/v1/auth/approle/role/{{ vault_ansible_approle_role_name }}"
    method: POST
    validate_certs: "{{ vault_policies_validate_certs }}"
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    body_format: json
    body:
      token_policies:
        - "{{ vault_ansible_approle_role_name }}"
      token_ttl: "{{ vault_ansible_approle_token_ttl }}"
      token_max_ttl: "{{ vault_ansible_approle_token_max_ttl }}"
      secret_id_ttl: "{{ vault_ansible_approle_secret_id_ttl }}"
      secret_id_num_uses: "{{ vault_ansible_approle_secret_id_num_uses }}"
    status_code: [200, 204]

- name: Debug AppRole update
  ansible.builtin.debug:
    msg: "AppRole '{{ vault_ansible_approle_role_name }}' created/updated."

# Read the role_id (always available, no generation needed)
- name: Read AppRole role_id
  ansible.builtin.uri:
    url: "{{ vault_policies_api_url }}/v1/auth/approle/role/{{ vault_ansible_approle_role_name }}/role-id"
    method: GET
    validate_certs: "{{ vault_policies_validate_certs }}"
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    status_code: [200]
  register: _approle_ansible_role_id_response

- name: Set role_id fact
  ansible.builtin.set_fact:
    _vault_ansible_role_id: "{{ _approle_ansible_role_id_response.json.data.role_id }}"

# Save the role_id — always (idempotent, fixed value)
- name: Ensure vault-backup directory exists locally
  ansible.builtin.file:
    path: "{{ vault_backup_dir }}"
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: false

- name: Save role_id to local backup
  ansible.builtin.copy:
    content: "{{ _vault_ansible_role_id }}"
    dest: "{{ vault_backup_dir }}/approle_ansible_role_id"
    mode: '0600'
  delegate_to: localhost
  become: false

# Generate the secret_id — only once (protected by sentinel)
- name: Generate secret_id (first bootstrap only)
  ansible.builtin.uri:
    url: "{{ vault_policies_api_url }}/v1/auth/approle/role/{{ vault_ansible_approle_role_name }}/secret-id"
    method: POST
    validate_certs: "{{ vault_policies_validate_certs }}"
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    body_format: json
    body: {}
    status_code: [200]
  register: _approle_ansible_secret_id_response
  when: not _approle_ansible_sentinel_stat.stat.exists

- name: Save secret_id to local backup
  ansible.builtin.copy:
    content: "{{ _approle_ansible_secret_id_response.json.data.secret_id }}"
    dest: "{{ vault_backup_dir }}/approle_ansible_secret_id"
    mode: '0600'
  delegate_to: localhost
  become: false
  when: not _approle_ansible_sentinel_stat.stat.exists

- name: Create AppRole ansible bootstrap sentinel
  ansible.builtin.file:
    path: "{{ vault_backup_dir }}/.approle_ansible_bootstrapped"
    state: touch
    mode: '0600'
  delegate_to: localhost
  become: false
  when: not _approle_ansible_sentinel_stat.stat.exists

- name: Debug AppRole ansible bootstrap result
  ansible.builtin.debug:
    msg:
      - "AppRole '{{ vault_ansible_approle_role_name }}' bootstrapped."
      - "  role_id  : {{ _vault_ansible_role_id }}"
      - "  secret_id: {{ _approle_ansible_secret_id_response.json.data.secret_id | default('(already generated — see ' + vault_backup_dir + '/approle_ansible_secret_id)') }}"
      - ""
      - "Update host_vars/lightsail1/vault_secrets.yml (ansible-vault) with:"
      - "  vault_approle_role_id: \"{{ _vault_ansible_role_id }}\""
      - "  vault_approle_secret_id: \"<secret_id from {{ vault_backup_dir }}/approle_ansible_secret_id>\""
  run_once: true
