---
# defaults file for install_node_exporter

node_exporter_os: "linux"
node_exporter_cpu_arch: "amd64"

node_exporter_port: "9100"
node_exporter_version: "1.9.1"
node_exporter_config_dir: "/etc/node_exporter"
node_exporter_binary: "/usr/local/bin/node_exporter"
node_exporter_user: "node_exporter"
node_exporter_group: "node_exporter"
node_exporter_service_file: "/etc/systemd/system/node_exporter.service"
node_exporter_web_config: "{{ node_exporter_config_dir }}/web_config.yml"
node_exporter_log_level: "info"
node_exporter_enabled: true
node_exporter_textfile_collector_enabled: false
node_exporter_textfile_dir: /var/node_exporter_textfile

# hwmon does not works on vm
node_exporter_default_collectors:
  - systemd
  - cpu_vulnerabilities
  - logind
  - network_route
  - processes
  - sysctl
  - filesystem:
      ignored-mount-points: "^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)"
      ignored-fs-types: "^(sys|proc|auto)fs$"

node_exporter_additional_collectors: []

node_exporter_enabled_collectors: "{{ node_exporter_default_collectors + node_exporter_additional_collectors }}"

node_exporter_disabled_collectors: []
node_exporter_basic_auth_users: []
node_exporter_cleanup_ssl_folder: false
node_exporter_tls_server_enabled: false
node_exporter_tls_validate_client_enabled: false
node_exporter_tls_clients: []
node_exporter_crt_file: "/etc/node_exporter_ssl/node_exporter.crt"
node_exporter_key_file: "/etc/node_exporter_ssl/node_exporter.key"
node_exporter_ca_file: "{{ node_exporter_config_dir }}/ca_client.crt"
# node_exporter_tls_clients_ca_cert - to define, no default value possible
