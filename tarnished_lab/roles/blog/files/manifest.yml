apiVersion: v1
kind: Namespace
metadata:
  name: blog

---
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-auth
  namespace: blog
type: kubernetes.io/dockerconfigjson
data:
  # ⚠️ Replace with a real dockerconfigjson or create the secret out-of-band:
  # kubectl create secret docker-registry ghcr-auth --docker-server=ghcr.io --docker-username=... --docker-password=... -n blog
  .dockerconfigjson: eyJhdXRocyI6e319

---
apiVersion: v1
kind: Secret
metadata:
  name: my-blog-backend-env
  namespace: blog
type: Opaque
stringData:
  PORT: "8081"
  ALLOWED_ORIGINS: 'http://localhost:3000, https://wnaseeve.com, https://www.wnaseeve.com'
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USER: "waseem.naseeven@gmail.com"
  SMTP_PASS: "ilmw wpre zsag bqtw"
  MAIL_FROM: "waseem.naseeven@gmail.com"
  MAIL_TO: "waseem.naseeven@gmail.com"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-blog-backend
  namespace: blog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-blog-backend
  template:
    metadata:
      labels:
        app: my-blog-backend
    spec:
      imagePullSecrets:
        - name: ghcr-auth
      containers:
        - name: backend
          image: ghcr.io/waseemnaseeven/my-blog-backend:latest
          ports:
            - containerPort: 8081
          envFrom:
            - secretRef:
                name: my-blog-backend-env
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: my-blog-backend
  namespace: blog
spec:
  selector:
    app: my-blog-backend
  ports:
    - port: 80
      targetPort: 8081

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-blog-frontend
  namespace: blog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-blog-frontend
  template:
    metadata:
      labels:
        app: my-blog-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-auth
      containers:
        - name: frontend
          image: ghcr.io/waseemnaseeven/my-blog-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: my-blog-frontend
  namespace: blog
spec:
  selector:
    app: my-blog-frontend
  ports:
    - port: 80
      targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-blog-ingress
  namespace: blog
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/router.tls.domains.0.main: wnaseeve.com

spec:
  ingressClassName: traefik
  rules:
    - host: wnaseeve.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: my-blog-backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: my-blog-frontend
                port:
                  number: 80
