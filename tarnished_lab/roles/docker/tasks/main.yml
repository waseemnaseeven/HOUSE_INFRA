---
# Install Docker Engine (Docker CE) on Debian-family hosts (Debian/Ubuntu/Raspberry Pi OS)
# using Docker's official APT repository (deb822 .sources).
#
# IMPORTANT:
# - This role first removes any existing Docker repo entries that may break apt update
#   (e.g. "ubuntu trixie"), then adds the correct repo.
# - For Raspberry Pi OS 32-bit (armhf), Docker v29+ is no longer published; consider Debian arm64 packages.

- name: Install Docker Engine from Docker APT repo (Debian-family)
  when: ansible_facts.os_family == "Debian"
  become: true
  block:
    ###########################################################################
    # 0) Clean up broken/old Docker repo entries (so apt update won't fail)
    ###########################################################################
    - name: Find existing Docker APT source files in sources.list.d
      ansible.builtin.find:
        paths: /etc/apt/sources.list.d
        patterns:
          - "*docker*.list"
          - "*docker*.sources"
      register: docker_sources

    - name: Remove existing Docker APT source files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ docker_sources.files }}"
      when: docker_sources.matched | int > 0

    - name: Remove Docker repo lines from /etc/apt/sources.list if present
      ansible.builtin.lineinfile:
        path: /etc/apt/sources.list
        state: absent
        regexp: '^deb\s+.*download\.docker\.com/.*$'
      ignore_errors: true

    ###########################################################################
    # 1) Base prerequisites
    ###########################################################################
    - name: Ensure prerequisites are present
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure apt keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Define supported Docker repo suites and fallbacks
      ansible.builtin.set_fact:
        docker_supported_suites:
          debian: ["trixie", "bookworm", "bullseye"]
          ubuntu: ["questing", "plucky", "noble", "jammy"]
          raspbian: ["bookworm", "bullseye"]
        docker_fallback_suite:
          debian: "bookworm"
          ubuntu: "jammy"
          raspbian: "bookworm"

    - name: Compute Docker repo distribution (ubuntu/debian/raspbian)
      ansible.builtin.set_fact:
        docker_repo_distribution: "{{ 'ubuntu' if ansible_distribution == 'Ubuntu' else ('raspbian' if ansible_distribution in ['Raspbian', 'Raspberry Pi OS'] and ansible_architecture not in ['aarch64'] else 'debian') }}"

    - name: Compute Docker repo suite (codename), with safe fallback
      ansible.builtin.set_fact:
        docker_repo_suite: "{{ ansible_distribution_release if ansible_distribution_release in (docker_supported_suites[docker_repo_distribution] | default([])) else (docker_fallback_suite[docker_repo_distribution] | default(ansible_distribution_release)) }}"
        docker_repo_using_fallback: "{{ (ansible_distribution_release not in (docker_supported_suites[docker_repo_distribution] | default([]))) | bool }}"

    - name: Warn when falling back to a supported suite
      ansible.builtin.debug:
        msg: >-
          Docker repo suite '{{ ansible_distribution_release }}' is not in supported list for '{{ docker_repo_distribution }}';
          falling back to '{{ docker_repo_suite }}'.
      when: docker_repo_using_fallback | bool

    - name: Warn about Raspberry Pi OS 32-bit package limitations
      ansible.builtin.debug:
        msg: >-
          Detected Raspberry Pi OS 32-bit (armhf/armv7). Docker upstream stops publishing new Raspberry Pi OS 32-bit packages
          after major v28; consider migrating to Debian arm64 (aarch64) or Debian armhf packages if you hit install issues.
      when:
        - ansible_distribution in ['Raspbian', 'Raspberry Pi OS']
        - ansible_architecture not in ['aarch64']

    ###########################################################################
    # 3) Add Docker's GPG key + APT repo (deb822)
    ###########################################################################
    - name: Download Docker GPG key (ASCII armored)
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ docker_repo_distribution }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
        force: true

    - name: Add Docker APT repository (deb822 .sources)
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: "https://download.docker.com/linux/{{ docker_repo_distribution }}"
        suites: "{{ docker_repo_suite }}"
        components: [stable]
        signed_by: /etc/apt/keyrings/docker.asc
        state: present
      register: docker_repo

    - name: Update apt cache if Docker repo changed
      ansible.builtin.apt:
        update_cache: true
      when: docker_repo.changed

    ###########################################################################
    # 4) Remove conflicting unofficial packages (safe best practice)
    ###########################################################################
    - name: Remove conflicting/unofficial Docker packages if present
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose
          - docker-compose-v2
          - docker-doc
          - podman-docker
          - containerd
          - runc
        state: absent
        purge: false
      ignore_errors: true

    ###########################################################################
    # 5) Install Docker Engine packages
    ###########################################################################
    - name: Install Docker Engine packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true
        cache_valid_time: 3600

    ###########################################################################
    # 6) Enable + start docker (skip if you intentionally want rootless-only)
    ###########################################################################
    - name: Ensure Docker service is enabled and running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
      when: not (docker_rootless_enabled | default(false))

- name: Skip Docker install (non Debian-family)
  when: ansible_facts.os_family != "Debian"
  ansible.builtin.debug:
    msg: "Docker role currently targets Debian-family hosts only."
