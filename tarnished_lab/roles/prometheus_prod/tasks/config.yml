---
- name: Copy rules
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ prometheus_config_dir }}/rules/{{ item }}"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0600"
  loop: "{{ prometheus_rules_copied }}"
  notify:
    - Restart prometheus

- name: Remove rules
  ansible.builtin.file:
    dest: "{{ prometheus_config_dir }}/rules/{{ item }}"
    state: absent
  loop: "{{ prometheus_rules_removed }}"
  notify:
    - Restart prometheus

- name: Copy ca-cert-clients
  when: prometheus_tls_validate_client_enabled
  ansible.builtin.copy:
    content: "{{ prometheus_tls_clients_ca_cert }}"
    dest: "{{ prometheus_ca_clients_file }}"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0600"
  notify:
    - Restart prometheus

- name: Copy ca-cert-servers
  ansible.builtin.copy:
    content: "{{ prometheus_tls_servers_ca_cert }}"
    dest: "{{ prometheus_ca_servers_file }}"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0600"
  notify:
    - Restart prometheus

- name: Deploying TLS config file
  when: prometheus_tls_server_enabled
  ansible.builtin.template:
    src: web_config.yml.j2
    dest: "{{ prometheus_tls_config }}"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0600"
  notify:
    - Restart prometheus

- name: Force failure if validate clients but clients empty
  ansible.builtin.fail:
    msg: "prometheus_tls_validate_client_enabled enabled but prometheus_tls_clients empty"
  when: prometheus_tls_validate_client_enabled and (prometheus_tls_clients | length) == 0

- name: Deploy the config file
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_file }}"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0600"
  notify:
    - Restart prometheus

- name: Deploying the systemd service
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: "{{ prometheus_service_file }}"
    mode: "0644"
  register: _prometheus_systemd_template
  notify:
    - Restart prometheus

- name: Daemon reload if service changed
  ansible.builtin.systemd_service:
    name: prometheus.service
    daemon_reload: yes
  when: _prometheus_systemd_template.changed

- name: Launch and activate the systemd service
  ansible.builtin.systemd_service:
    name: prometheus.service
    state: started
    enabled: true
