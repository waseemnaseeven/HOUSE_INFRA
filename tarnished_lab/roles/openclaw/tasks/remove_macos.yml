---
- name: Unload openclaw launchd service
  ansible.builtin.shell: |
    launchctl bootout gui/$(id -u) "{{ openclaw_plist_path }}" 2>/dev/null || true
  changed_when: true

- name: Remove openclaw launchd plist
  ansible.builtin.file:
    path: "{{ openclaw_plist_path }}"
    state: absent

- name: Detect npm (Homebrew first, then PATH)
  ansible.builtin.shell: |
    export NVM_DIR="${HOME}/.nvm"
    [ -s "${NVM_DIR}/nvm.sh" ] && . "${NVM_DIR}/nvm.sh" --no-use
    if [ -x "/opt/homebrew/bin/npm" ]; then
      echo "/opt/homebrew/bin/npm"
    elif command -v npm >/dev/null 2>&1; then
      command -v npm
    elif [ -x "/usr/local/bin/npm" ]; then
      echo "/usr/local/bin/npm"
    else
      echo "npm not found" >&2 && exit 1
    fi
  register: _npm
  changed_when: false

- name: Uninstall openclaw globally via npm
  ansible.builtin.shell: "{{ _npm.stdout | trim }} uninstall -g openclaw"
  failed_when: false
  changed_when: true

- name: Remove openclaw config and data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ openclaw_config_dir }}"
    - "{{ openclaw_log_dir }}"
  when: openclaw_remove_data | bool
