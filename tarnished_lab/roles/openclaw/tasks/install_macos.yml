---
- name: Ensure Homebrew is available
  ansible.builtin.command: brew --version
  register: _brew_check
  changed_when: false
  failed_when: _brew_check.rc != 0

- name: Detect npm (Homebrew first, then PATH)
  ansible.builtin.shell: |
    if [ -x "/opt/homebrew/bin/npm" ]; then
      echo "/opt/homebrew/bin/npm"
    elif command -v npm >/dev/null 2>&1; then
      command -v npm
    else
      echo "npm not found — install Node.js via Homebrew: brew install node" >&2
      exit 1
    fi
  register: _npm
  changed_when: false

- name: Install openclaw globally via npm
  community.general.npm:
    name: openclaw
    version: "{{ openclaw_version | default(omit) }}"
    global: true
    executable: "{{ _npm.stdout | trim }}"
    state: present

- name: Detect openclaw binary path
  ansible.builtin.shell: |
    NPM_BIN=$({{ _npm.stdout | trim }} root -g 2>/dev/null | xargs dirname)/bin/openclaw
    if [ -x "${NPM_BIN}" ]; then
      echo "${NPM_BIN}"
    elif command -v openclaw >/dev/null 2>&1; then
      command -v openclaw
    else
      echo "openclaw binary not found after install" >&2
      exit 1
    fi
  register: _openclaw_bin
  changed_when: false

- name: Set openclaw_bin fact
  ansible.builtin.set_fact:
    openclaw_bin: "{{ _openclaw_bin.stdout | trim }}"

- name: Create openclaw directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ openclaw_config_dir }}"
    - "{{ openclaw_workspace_dir }}"
    - "{{ openclaw_log_dir }}"

- name: Deploy openclaw config
  ansible.builtin.template:
    src: openclaw.json.j2
    dest: "{{ openclaw_config_dir }}/openclaw.json"
    mode: "0600"
  notify: Reload OpenClaw service

- name: Ensure LaunchAgents directory exists
  ansible.builtin.file:
    path: "{{ openclaw_plist_path | dirname }}"
    state: directory
    mode: "0755"

- name: Deploy openclaw launchd plist
  ansible.builtin.template:
    src: openclaw.plist.j2
    dest: "{{ openclaw_plist_path }}"
    mode: "0644"
  notify: Reload OpenClaw service

- name: Bootstrap openclaw with launchd immediately
  ansible.builtin.shell: |
    launchctl bootout gui/$(id -u) "{{ openclaw_plist_path }}" 2>/dev/null || true
    launchctl bootstrap gui/$(id -u) "{{ openclaw_plist_path }}"
  changed_when: true
