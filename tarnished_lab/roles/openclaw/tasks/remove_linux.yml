---
- name: Stop and disable openclaw systemd user service
  ansible.builtin.systemd:
    name: "{{ openclaw_service_name }}"
    state: stopped
    enabled: false
    scope: user
  failed_when: false

- name: Remove openclaw systemd unit file
  ansible.builtin.file:
    path: "{{ openclaw_systemd_unit_dir }}/{{ openclaw_service_name }}.service"
    state: absent

- name: Reload systemd user daemon after unit removal
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user

- name: Detect npm path
  ansible.builtin.command: which npm
  register: _npm
  changed_when: false
  failed_when: _npm.rc != 0

- name: Uninstall openclaw globally via npm
  ansible.builtin.shell: "{{ _npm.stdout | trim }} uninstall -g openclaw"
  failed_when: false
  changed_when: true

- name: Remove openclaw config and data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ openclaw_config_dir }}"
    - "{{ openclaw_log_dir }}"
  when: openclaw_remove_data | bool
