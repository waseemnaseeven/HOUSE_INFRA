---
- name: Wait for Vault to be ready
  ansible.builtin.uri:
    url: "{{ vault_api_addr }}/v1/sys/health"
    method: GET
    status_code: [200, 429, 472, 473, 501, 503]
  register: vault_health
  until: vault_health.status in [200, 429, 501, 503]
  retries: 10
  delay: 5

- name: Check if Vault is already initialized
  ansible.builtin.uri:
    url: "{{ vault_api_addr }}/v1/sys/init"
    method: GET
    status_code: [200]
  register: vault_init_status

- name: Initialize Vault
  ansible.builtin.uri:
    url: "{{ vault_api_addr }}/v1/sys/init"
    method: POST
    body_format: json
    body:
      secret_shares: 5
      secret_threshold: 3
    status_code: [200]
  register: vault_init_response
  when: not vault_init_status.json.initialized

- name: Save full Vault init response as JSON
  ansible.builtin.copy:
    content: |
      {{ vault_init_response.json | to_yaml }}
    dest: "{{ vault_unseal_keys_dir }}/unseal_keys_full.json"
    owner: "{{ vault_user }}"
    group: "{{ vault_group }}"
    mode: '0600'
  when: not vault_init_status.json.initialized

- name: Save root token
  ansible.builtin.copy:
    content: "{{ vault_init_response.json.root_token }}"
    dest: "{{ vault_root_token_file }}"
    owner: "{{ vault_user }}"
    group: "{{ vault_group }}"
    mode: '0600'
  when: not vault_init_status.json.initialized

- name: Display initialization message
  ansible.builtin.debug:
    msg:
      - "Vault has been initialized!"
      - "Root token saved to: {{ vault_root_token_file }}"
      - "Unseal keys saved to: {{ vault_unseal_keys_dir }}/unseal_keys.json"
      - "IMPORTANT: Backup these files securely!"
  when: not vault_init_status.json.initialized

- name: Fetch Vault keys to local backup directory
  ansible.builtin.fetch:
    src: "{{ item }}"
    dest: "{{ playbook_dir }}/../vault-backup/{{ inventory_hostname }}/"
    flat: yes
  loop:
    - "{{ vault_root_token_file }}"
    - "{{ vault_unseal_keys_dir }}/unseal_keys_full.json"
  when: not vault_init_status.json.initialized
  delegate_to: "{{ inventory_hostname }}"

- name: Display backup location
  ansible.builtin.debug:
    msg:
      - "✓ Vault keys backed up locally to:"
      - "  {{ playbook_dir }}/../vault-backup/{{ inventory_hostname }}/"
      - "  - root_token"
      - "  - unseal_keys.json"
      - ""
      - "⚠ IMPORTANT: Encrypt and store these files securely!"
  when: not vault_init_status.json.initialized
  run_once: true

- name: Check if unseal keys file exists
  ansible.builtin.stat:
    path: "{{ vault_unseal_keys_dir }}/unseal_keys_full.json"
  register: unseal_keys_file_stat

- name: Load unseal keys from file
  ansible.builtin.slurp:
    src: "{{ vault_unseal_keys_dir }}/unseal_keys_full.json"
  register: unseal_keys_file
  when: unseal_keys_file_stat.stat.exists

- name: Set unseal keys fact
  ansible.builtin.set_fact:
    vault_unseal_keys: "{{ unseal_keys_file.content | b64decode | from_yaml }}"
  when: unseal_keys_file_stat.stat.exists

- name: Check seal status
  ansible.builtin.uri:
    url: "{{ vault_api_addr }}/v1/sys/seal-status"
    method: GET
    status_code: [200]
  register: vault_seal_status

- name: Unseal Vault (step 1)
  ansible.builtin.uri:
    url: "{{ vault_api_addr }}/v1/sys/unseal"
    method: POST
    body_format: json
    body:
      key: "{{ vault_unseal_keys['keys'][0] }}"
    status_code: [200]
  when: vault_seal_status.json.sealed and unseal_keys_file_stat.stat.exists

- name: Unseal Vault (step 2)
  ansible.builtin.uri:
    url: "{{ vault_api_addr }}/v1/sys/unseal"
    method: POST
    body_format: json
    body:
      key: "{{ vault_unseal_keys['keys'][1] }}"
    status_code: [200]
  when: vault_seal_status.json.sealed and unseal_keys_file_stat.stat.exists

- name: Unseal Vault (step 3)
  ansible.builtin.uri:
    url: "{{ vault_api_addr }}/v1/sys/unseal"
    method: POST
    body_format: json
    body:
      key: "{{ vault_unseal_keys['keys'][2] }}"
    status_code: [200]
  register: unseal_final
  when: vault_seal_status.json.sealed and unseal_keys_file_stat.stat.exists

- name: Warning if unseal keys missing
  ansible.builtin.fail:
    msg:
      - "ERROR: Vault is sealed but unseal keys file not found!"
      - "Expected location: {{ vault_unseal_keys_dir }}/unseal_keys.json"
      - "If this is a fresh install, the keys should have been created during initialization."
      - "If Vault was previously initialized, restore the unseal keys from backup."
  when: vault_seal_status.json.sealed and not unseal_keys_file_stat.stat.exists

- name: Verify Vault is unsealed
  ansible.builtin.debug:
    msg: "Vault is now unsealed and ready!"
  when: unseal_final.json.sealed is defined and not unseal_final.json.sealed
