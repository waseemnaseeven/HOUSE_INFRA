---
- name: All4One
  hosts: lightsail
  become: yes
  pre_tasks:
    - name: Ensure pip is installed
      ansible.builtin.apt:
        name: python3-pip
        state: present
        update_cache: yes

    - name: Ensure kubernetes Python library is up to date
      ansible.builtin.pip:
        name: "kubernetes>=24.2.0"
        state: present
        extra_args: --break-system-packages
  roles:
    # - general
    # - k3s
    # - argocd
    # - blog
    # - vault
    # - vault_policies
    - role: openclaw
