---
- name: Deploy OpenVPN with HashiCorp Vault PKI
  hosts: raspberry_pi
  become: yes

  tasks:
    - name: Deploy HashiCorp Vault
      ansible.builtin.include_role:
        name: vault
      tags: vault

    - name: Deploy OpenVPN Server
      ansible.builtin.include_role:
        name: openvpn
      vars:
        openvpn_clients:
          - name: "client1"
            common_name: "client1.vpn.tarnished.lab"
          # Add more clients as needed:
          # - name: "client2"
          #   common_name: "client2.vpn.tarnished.lab"
      tags: openvpn
